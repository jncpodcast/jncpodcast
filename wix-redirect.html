<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05051f">
  <title>Jams 'N' Cocktails Has Moved</title>
  <style>
    :root {
      color-scheme: dark;
      --yellow: #fff500;
      --navy: #05053d;
      --ink: #080913;
      --pink: #ff2cad;
      --cyan: #26e7ff;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      padding: clamp(16px, 4vw, 42px);
      color: white;
      background:
        radial-gradient(circle at 50% 42%, rgba(38, 231, 255, .16), transparent 30%),
        radial-gradient(circle at 72% 18%, rgba(255, 44, 173, .18), transparent 26%),
        linear-gradient(145deg, #04040d 0%, var(--navy) 58%, #070711 100%);
      font-family: "Arial Narrow", Impact, Haettenschweiler, Arial, sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .18;
      background:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 4px 4px, 42px 42px;
    }

    .portal {
      position: relative;
      isolation: isolate;
      width: min(880px, 100%);
      min-height: min(620px, calc(100svh - 32px));
      display: grid;
      place-items: center;
      padding: clamp(26px, 6vw, 68px);
      overflow: hidden;
      text-align: center;
      border: 2px solid rgba(255, 245, 0, .72);
      border-radius: clamp(22px, 4vw, 38px);
      background:
        linear-gradient(180deg, rgba(8, 9, 25, .62), rgba(5, 5, 20, .94)),
        url("https://pub-8e6b2ea3995b4e388da2a7f4b7057ada.r2.dev/assets/images/jnc-crew-hero.jpg") center 25% / cover;
      box-shadow:
        0 0 0 6px rgba(255, 245, 0, .06),
        0 0 42px rgba(255, 245, 0, .22),
        0 0 90px rgba(255, 44, 173, .16),
        inset 0 0 80px rgba(0, 0, 0, .72);
    }

    .portal::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      background: linear-gradient(105deg, transparent 20%, rgba(255,255,255,.08) 45%, transparent 68%);
      transform: translateX(-120%);
      animation: shimmer 6s ease-in-out infinite;
    }

    .content {
      width: min(620px, 100%);
      padding: clamp(22px, 5vw, 42px);
      border-radius: 24px;
      background: rgba(4, 5, 19, .78);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .48);
      backdrop-filter: blur(8px);
    }

    .logo {
      display: block;
      width: min(390px, 92%);
      max-height: 132px;
      margin: 0 auto clamp(18px, 4vw, 30px);
      object-fit: contain;
      filter: drop-shadow(0 0 18px rgba(255, 245, 0, .34));
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--cyan);
      font: 800 clamp(.72rem, 2.2vw, .9rem)/1.2 "Courier New", monospace;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 12ch;
      margin: 0 auto 14px;
      font-size: clamp(2.25rem, 8vw, 5.3rem);
      line-height: .88;
      letter-spacing: -.035em;
      text-transform: uppercase;
      text-shadow: 4px 4px 0 rgba(255, 44, 173, .48);
    }

    p {
      max-width: 36rem;
      margin: 0 auto clamp(22px, 5vw, 34px);
      color: #e7e7ed;
      font-family: Arial, sans-serif;
      font-size: clamp(1rem, 2.8vw, 1.18rem);
      line-height: 1.5;
    }

    .enter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 58px;
      padding: 16px clamp(24px, 6vw, 42px);
      border: 0;
      border-radius: 999px;
      color: #050510;
      background: var(--yellow);
      box-shadow: 0 7px 0 #c7a900, 0 0 28px rgba(255, 245, 0, .42);
      font-size: clamp(1rem, 3vw, 1.24rem);
      font-weight: 1000;
      letter-spacing: .055em;
      text-decoration: none;
      text-transform: uppercase;
      transition: transform .16s ease, box-shadow .16s ease;
      touch-action: manipulation;
    }

    .enter:hover,
    .enter:focus-visible {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 10px 0 #c7a900, 0 0 40px rgba(255, 245, 0, .62);
      outline: 3px solid white;
      outline-offset: 5px;
    }

    .enter:active {
      transform: translateY(5px);
      box-shadow: 0 2px 0 #c7a900, 0 0 25px rgba(255, 245, 0, .45);
    }

    .arrow { font-size: 1.35em; line-height: 0; }

    @keyframes shimmer {
      0%, 66% { transform: translateX(-120%); }
      84%, 100% { transform: translateX(120%); }
    }

    @media (max-width: 600px) {
      body { padding: 10px; }
      .portal {
        min-height: calc(100svh - 20px);
        padding: 14px;
        border-radius: 22px;
      }
      .content { padding: 26px 18px 32px; }
      h1 { font-size: clamp(2.25rem, 14vw, 4rem); }
    }

    @media (prefers-reduced-motion: reduce) {
      .portal::after { animation: none; }
      .enter { transition: none; }
    }
  </style>
</head>
<body>
  <main class="portal">
    <section class="content" aria-labelledby="portal-title">
      <img class="logo" src="https://pub-8e6b2ea3995b4e388da2a7f4b7057ada.r2.dev/assets/images/jnc-logo-full-yellow.png" alt="Jams 'N' Cocktails">
      <div class="eyebrow">Transmission incoming</div>
      <h1 id="portal-title">We’ve moved the party</h1>
      <p>The new Jams ’N’ Cocktails universe is live. Come on in for the show, cocktails, games, episode recaps, and all the usual shenanigans.</p>
      <a class="enter" href="https://www.brockentertainment.com/" target="_top" rel="noopener">
        Click or tap to enter <span class="arrow" aria-hidden="true">→</span>
      </a>
    </section>
  </main>
</body>
</html>
